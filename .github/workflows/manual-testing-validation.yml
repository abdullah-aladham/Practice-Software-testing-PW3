name: Manual test Validation WorkFlow

on:
    push:
        branches:
           [master]
        paths:
            - 'maunal_tests/**/*.yml'
            - 'manual_tests/**/*.yaml'     
    pull_request:
        branches:
           [ master ]      
        paths:
            - 'maunal_tests/**/*.yml'
            - 'manual_tests/**/*.yaml'     

jobs:
 syntax-check:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
                node-version: lts/*
          - name: Prettier Code Check
            run: npx prettier --check .
          - name:  Run SonarCloud Scan
            uses:  SonarSource/sonarcloud-github-action@master
          - name: Run Snyk
            uses: snyk/actions/node@master