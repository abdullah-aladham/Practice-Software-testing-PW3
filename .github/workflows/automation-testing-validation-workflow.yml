name: Automation Testing Validation workflow
on:
   push:
    branches: [master]

       pull_request:
        branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Setup Node.js
          uses: actions/setup-node@v3
          with:
                node-version: lts/*
        - name: Install dependencies
          run: npm ci
        
